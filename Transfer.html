<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SMC Smart Bank - Transfer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

.transfer-box{
background:#111827;
padding:35px;
border-radius:25px;
box-shadow:0 0 20px rgba(255,215,0,.15);
}

.form-control{
background:#1e293b;
border:none;
color:white;
padding:15px;
}

.form-control:focus{
background:#1e293b;
color:white;
box-shadow:none;
border:1px solid gold;
}

.btn-transfer{
background:gold;
color:black;
font-weight:bold;
padding:14px;
border:none;
border-radius:12px;
width:100%;
}

.receipt{
display:none;
background:#111827;
padding:20px;
border-radius:20px;
margin-top:20px;
}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark glass-nav">

<div class="container">

<a class="navbar-brand fw-bold" href="index.html">
SMC SMART BANK
</a>

<button class="navbar-toggler"
data-bs-toggle="collapse"
data-bs-target="#menu"> <span class="navbar-toggler-icon"></span> </button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="dashboard.html">Dashboard</a>
</li>

<li class="nav-item">
<a class="nav-link active" href="transfer.html">Transfer</a>
</li>

<li class="nav-item">
<a class="nav-link" href="airtime.html">Airtime</a>
</li>

<li class="nav-item">
<a class="nav-link" href="data.html">Data</a>
</li>

<li class="nav-item">
<a class="nav-link" href="cards.html">Cards</a>
</li>

<li class="nav-item">
<a class="nav-link" href="profile.html">Profile</a>
</li>

</ul>

</div>

</div>

</nav>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-7">

<div class="transfer-box">

<h2 class="mb-4">
<i class="fas fa-money-bill-transfer"></i>
 Transfer Funds
</h2>

<div class="mb-3">

<label>Bank Name</label>

<select class="form-control" id="bank">
<option>SMC Smart Bank</option>
<option>Opay</option>
<option>Palmpay</option>
<option>Kuda</option>
<option>Moniepoint</option>
<option>Access Bank</option>
<option>GTBank</option>
</select>

</div>

<div class="mb-3">

<label>Account Number</label>

<input
type="text"
id="account"
class="form-control"
placeholder="Enter Account Number">

</div>

<div class="mb-3">

<label>Account Name</label>

<input
type="text"
id="name"
class="form-control"
placeholder="Receiver Name">

</div>

<div class="mb-3">

<label>Amount</label>

<input
type="number"
id="amount"
class="form-control"
placeholder="Enter Amount">

</div>

<div class="mb-3">

<label>Description</label>

<input
type="text"
id="desc"
class="form-control"
placeholder="Payment Description">

</div>

<button
class="btn-transfer"
onclick="sendMoney()">

Transfer Now

</button>

<div class="receipt" id="receipt">

<h4>Transfer Successful</h4>

<hr>

<p><strong>Bank:</strong> <span id="rBank"></span></p>

<p><strong>Account:</strong> <span id="rAccount"></span></p>

<p><strong>Name:</strong> <span id="rName"></span></p>

<p><strong>Amount:</strong> ₦<span id="rAmount"></span></p>

<p><strong>Description:</strong> <span id="rDesc"></span></p>

</div>

</div>

</div>

</div>

</div>

<script>

function sendMoney(){

let bank =
document.getElementById("bank").value;

let account =
document.getElementById("account").value;

let name =
document.getElementById("name").value;

let amount =
document.getElementById("amount").value;

let desc =
document.getElementById("desc").value;

if(
account === "" ||
name === "" ||
amount === ""
){
alert("Please fill all fields");
return;
}

document.getElementById("receipt").style.display="block";

document.getElementById("rBank").innerHTML=bank;
document.getElementById("rAccount").innerHTML=account;
document.getElementById("rName").innerHTML=name;
document.getElementById("rAmount").innerHTML=amount;
document.getElementById("rDesc").innerHTML=desc;

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
