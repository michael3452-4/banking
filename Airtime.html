<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SMC Smart Bank - Buy Airtime</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

.airtime-box{
background:#111827;
padding:35px;
border-radius:25px;
box-shadow:0 0 25px rgba(255,215,0,.15);
}

.network-card{
background:#1e293b;
padding:15px;
border-radius:15px;
text-align:center;
cursor:pointer;
transition:.3s;
margin-bottom:10px;
}

.network-card:hover{
transform:translateY(-5px);
border:1px solid gold;
}

.amount-btn{
margin:5px;
}

.receipt{
display:none;
background:#1e293b;
padding:20px;
border-radius:20px;
margin-top:20px;
}

.form-control{
background:#1e293b;
border:none;
color:white;
}

.form-control:focus{
background:#1e293b;
color:white;
border:1px solid gold;
box-shadow:none;
}

.buy-btn{
background:gold;
color:black;
font-weight:bold;
width:100%;
padding:14px;
border:none;
border-radius:12px;
}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark glass-nav">

<div class="container">

<a class="navbar-brand fw-bold" href="index.html">
SMC SMART BANK
</a>

<button class="navbar-toggler"
data-bs-toggle="collapse"
data-bs-target="#menu">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="dashboard.html">Dashboard</a>
</li>

<li class="nav-item">
<a class="nav-link" href="transfer.html">Transfer</a>
</li>

<li class="nav-item">
<a class="nav-link active" href="airtime.html">Airtime</a>
</li>

<li class="nav-item">
<a class="nav-link" href="data.html">Data</a>
</li>

<li class="nav-item">
<a class="nav-link" href="cards.html">Cards</a>
</li>

<li class="nav-item">
<a class="nav-link" href="profile.html">Profile</a>
</li>

</ul>

</div>

</div>

</nav>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-7">

<div class="airtime-box">

<h2 class="mb-4">
<i class="fas fa-mobile-screen"></i>
 Buy Airtime
</h2>

<label class="mb-2">Select Network</label>

<div class="row">

<div class="col-6">
<div class="network-card" onclick="selectNetwork('MTN')">
MTN
</div>
</div>

<div class="col-6">
<div class="network-card" onclick="selectNetwork('Airtel')">
Airtel
</div>
</div>

<div class="col-6">
<div class="network-card" onclick="selectNetwork('Glo')">
Glo
</div>
</div>

<div class="col-6">
<div class="network-card" onclick="selectNetwork('9mobile')">
9mobile
</div>
</div>

</div>

<input type="hidden" id="network">

<div class="mt-4">

<label>Phone Number</label>

<input
type="text"
id="phone"
class="form-control"
placeholder="08012345678">

</div>

<div class="mt-3">

<label>Quick Amount</label>

<br>

<button class="btn btn-outline-warning amount-btn"
onclick="setAmount(100)">₦100</button>

<button class="btn btn-outline-warning amount-btn"
onclick="setAmount(200)">₦200</button>

<button class="btn btn-outline-warning amount-btn"
onclick="setAmount(500)">₦500</button>

<button class="btn btn-outline-warning amount-btn"
onclick="setAmount(1000)">₦1000</button>

<button class="btn btn-outline-warning amount-btn"
onclick="setAmount(2000)">₦2000</button>

</div>

<div class="mt-3">

<label>Amount</label>

<input
type="number"
id="amount"
class="form-control"
placeholder="Enter Amount">

</div>

<button
class="buy-btn mt-4"
onclick="buyAirtime()">

Buy Airtime

</button>

<div class="receipt" id="receipt">

<h4>Airtime Purchase Successful</h4>

<hr>

<p><strong>Network:</strong> <span id="rNetwork"></span></p>

<p><strong>Phone:</strong> <span id="rPhone"></span></p>

<p><strong>Amount:</strong> ₦<span id="rAmount"></span></p>

</div>

</div>

</div>

</div>

</div>

<script>

function selectNetwork(network){
document.getElementById("network").value = network;
}

function setAmount(amount){
document.getElementById("amount").value = amount;
}

function buyAirtime(){

let network =
document.getElementById("network").value;

let phone =
document.getElementById("phone").value;

let amount =
document.getElementById("amount").value;

if(network==="" || phone==="" || amount===""){
alert("Please complete all fields");
return;
}

document.getElementById("receipt").style.display="block";

document.getElementById("rNetwork").innerHTML=network;
document.getElementById("rPhone").innerHTML=phone;
document.getElementById("rAmount").innerHTML=amount;

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
