<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SMC Smart Bank - Buy Data</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

.data-box{
background:#111827;
padding:35px;
border-radius:25px;
box-shadow:0 0 25px rgba(255,215,0,.15);
}

.network-card,
.plan-card{
background:#1e293b;
padding:15px;
border-radius:15px;
text-align:center;
cursor:pointer;
transition:.3s;
margin-bottom:15px;
}

.network-card:hover,
.plan-card:hover{
transform:translateY(-5px);
border:1px solid gold;
}

.receipt{
display:none;
background:#1e293b;
padding:20px;
border-radius:20px;
margin-top:20px;
}

.form-control{
background:#1e293b;
border:none;
color:white;
}

.form-control:focus{
background:#1e293b;
color:white;
border:1px solid gold;
box-shadow:none;
}

.buy-btn{
background:gold;
color:black;
font-weight:bold;
width:100%;
padding:14px;
border:none;
border-radius:12px;
}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark glass-nav">

<div class="container">

<a class="navbar-brand fw-bold" href="index.html">
SMC SMART BANK
</a>

<button class="navbar-toggler"
data-bs-toggle="collapse"
data-bs-target="#menu">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="dashboard.html">Dashboard</a>
</li>

<li class="nav-item">
<a class="nav-link" href="transfer.html">Transfer</a>
</li>

<li class="nav-item">
<a class="nav-link" href="airtime.html">Airtime</a>
</li>

<li class="nav-item">
<a class="nav-link active" href="data.html">Data</a>
</li>

<li class="nav-item">
<a class="nav-link" href="cards.html">Cards</a>
</li>

<li class="nav-item">
<a class="nav-link" href="profile.html">Profile</a>
</li>

</ul>

</div>

</div>

</nav>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="data-box">

<h2 class="mb-4">
<i class="fas fa-wifi"></i>
 Buy Data Bundle
</h2>

<label>Select Network</label>

<div class="row mt-2">

<div class="col-md-3">
<div class="network-card" onclick="selectNetwork('MTN')">MTN</div>
</div>

<div class="col-md-3">
<div class="network-card" onclick="selectNetwork('Airtel')">Airtel</div>
</div>

<div class="col-md-3">
<div class="network-card" onclick="selectNetwork('Glo')">Glo</div>
</div>

<div class="col-md-3">
<div class="network-card" onclick="selectNetwork('9mobile')">9mobile</div>
</div>

</div>

<input type="hidden" id="network">

<div class="mt-4">

<label>Phone Number</label>

<input
type="text"
id="phone"
class="form-control"
placeholder="08012345678">

</div>

<h5 class="mt-4">
Choose Data Plan
</h5>

<div class="row mt-2">

<div class="col-md-4">
<div class="plan-card"
onclick="selectPlan('1GB',500)">
1GB - ₦500
</div>
</div>

<div class="col-md-4">
<div class="plan-card"
onclick="selectPlan('2GB',1000)">
2GB - ₦1000
</div>
</div>

<div class="col-md-4">
<div class="plan-card"
onclick="selectPlan('5GB',2000)">
5GB - ₦2000
</div>
</div>

<div class="col-md-4">
<div class="plan-card"
onclick="selectPlan('10GB',3500)">
10GB - ₦3500
</div>
</div>

<div class="col-md-4">
<div class="plan-card"
onclick="selectPlan('15GB',5000)">
15GB - ₦5000
</div>
</div>

<div class="col-md-4">
<div class="plan-card"
onclick="selectPlan('25GB',8000)">
25GB - ₦8000
</div>
</div>

</div>

<input type="hidden" id="plan">
<input type="hidden" id="price">

<button
class="buy-btn mt-4"
onclick="buyData()">

Buy Data Bundle

</button>

<div class="receipt" id="receipt">

<h4>Data Purchase Successful</h4>

<hr>

<p><strong>Network:</strong> <span id="rNetwork"></span></p>

<p><strong>Phone:</strong> <span id="rPhone"></span></p>

<p><strong>Bundle:</strong> <span id="rPlan"></span></p>

<p><strong>Amount:</strong> ₦<span id="rPrice"></span></p>

</div>

</div>

</div>

</div>

</div>

<script>

function selectNetwork(network){
document.getElementById("network").value = network;
}

function selectPlan(plan,price){
document.getElementById("plan").value = plan;
document.getElementById("price").value = price;
}

function buyData(){

let network =
document.getElementById("network").value;

let phone =
document.getElementById("phone").value;

let plan =
document.getElementById("plan").value;

let price =
document.getElementById("price").value;

if(
network === "" ||
phone === "" ||
plan === ""
){
alert("Please complete all fields");
return;
}

document.getElementById("receipt").style.display="block";

document.getElementById("rNetwork").innerHTML=network;
document.getElementById("rPhone").innerHTML=phone;
document.getElementById("rPlan").innerHTML=plan;
document.getElementById("rPrice").innerHTML=price;

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
